org.gradle.jvmargs=-Xmx2560m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Disabled locally: a cached mergeDebugResources output survived a res folder
# rename and produced a stale "mipmap/ic_launcher not found" failure.
org.gradle.caching=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
