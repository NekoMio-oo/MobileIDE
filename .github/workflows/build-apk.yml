name: Build MobileIDE APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The app pins NDK 27.2.12479018 for its forkpty bridge (ndk-build, no CMake).
      # The PRoot/Debian runtime is downloaded on the device, not bundled here.
      - name: Install Android platform 35, build-tools and NDK 27.2.12479018
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.2.12479018"

      - name: Set up Gradle (wrapper 8.10.2)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileIDE-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to apk-output branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          rm -rf /tmp/out && mkdir -p /tmp/out && cd /tmp/out
          git init -q -b apk-output
          cp "$GITHUB_WORKSPACE/$APK" MobileIDE-debug.apk
          sha256sum MobileIDE-debug.apk > SHA256SUMS
          ls -la
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-output
